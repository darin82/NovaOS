modules-search: [local, /usr/lib/calamares/modules]
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
prompt-install: true
dont-chroot: false
branding: novaos

instances:
  - id: profile
    module: packagechooser
    config: profile.conf
  - id: extras
    module: packagechooser
    config: extras.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - packagechooser@profile
      - packagechooser@extras
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - luksbootkeyfile
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - nova-prepare
      - grubcfg
      - bootloader
      - initramfscfg
      - initramfs
      - nova-install
      - umount
  - show:
      - finished
